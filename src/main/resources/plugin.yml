name: AngelSMP
version: '${version}'
main: com.angelsmp.angel.AngelPlugin
api-version: '1.21'
authors: [Aman Kumar]
description: Angel/Devil elemental SMP - alignment selection, floating head-signs, 6 element ability trees, boss bar + action bar HUD, death lockout system, altars and an admin power matrix.
website: https://github.com/amantrivedi7766-bit/Anglesmp67
softdepend: [ProtocolLib, LuckPerms]

commands:
  angel:
    description: Angel SMP main command.
    usage: /angel <power|admin|upgrade|cast|token|reload>
    aliases: [angelsmp]
  upgrade:
    description: Open the Upgrade GUI.
    usage: /upgrade

permissions:
  angel.use:
    description: Allows using the element menus and abilities.
    default: true
  angel.admin:
    description: Allows access to the Admin Management GUI.
    default: op
