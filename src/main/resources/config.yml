# ============================================================
#  AngelSMP - config.yml
# ============================================================

# ---- Module 1: Database --------------------------------------------
database:
  # "sqlite" (local file) or "mysql" (external data server).
  type: sqlite
  mysql:
    host: 127.0.0.1
    port: 3306
    database: angelsmp
    username: root
    password: ""

# ---- Module 2B: Banishment spawn -----------------------------------
# Where a Demon is sent on respawn (defaults to the Nether).
spawn:
  world: world_nether
  x: 0.0
  y: 80.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

# ---- Module 2C: Purification ---------------------------------------
purification:
  # World spawn a purified Demon is returned to.
  overworld: world

# ---- Module 4B Path B: Sacrifice upgrade costs ---------------------
# Material price to reach each level from the one below it.
upgrade:
  costs:
    1:
      material: DIAMOND
      amount: 64
    2:
      material: NETHERITE_SCRAP
      amount: 32
    3:
      material: NETHERITE_INGOT
      amount: 16
    4:
      material: NETHER_STAR
      amount: 8
    5:
      material: NETHERITE_BLOCK
      amount: 64
