# AngelSMP Core Configuration File
server-settings:
  check-updates: true
  save-interval-minutes: 5

alignment-settings:
  halo-particle-density: 15
  halo-spin-speed: 1.2
  enable-devil-horns: true

ability-settings:
  fire-angel:
    base-damage: 8.0 # 4 Hearts
    cooldown-seconds: 10
    burn-duration-seconds: 6
  ice-angel:
    freeze-duration-seconds: 3
    cooldown-seconds: 15
    range-blocks: 12
  lightning-angel:
    base-damage: 6.0 # 3 Hearts
    stun-duration-seconds: 2
    cooldown-seconds: 12
  wind-angel:
    cooldown-seconds: 8
    dash-blocks: 15.0
    safe-fall-blocks: 30
  earth-angel:
    cooldown-seconds: 20
    shield-duration-seconds: 6
  light-angel:
    cooldown-seconds: 18
    heal-amount: 8.0 # 4 Hearts

death-system:
  enable-shatter-particles: true
  drop-soul-essence: true
  soul-essence-item: "NETHER_STAR"
  lockout-duration-minutes: 15
  apply-weakness-on-respawn: true
  weakness-duration-seconds: 30

# Phase 6 recovery rituals
altar-recovery:
  # The offering required at a Sacred Altar (1 Nether Star also works).
  item-material: DIAMOND_BLOCK
  item-amount: 3

# Phase 5 upgrade economy
upgrade:
  currency: XP_LEVELS # XP_LEVELS or TOKENS
  xp-levels-per-tier: 50
  tokens-per-tier: 10

gui-settings:
  title-main-menu: "&8[&bAngel SMP&8] &7Menu"
  title-admin-menu: "&4&lAdmin Power Matrix"
  fill-empty-slots-with-panes: true
