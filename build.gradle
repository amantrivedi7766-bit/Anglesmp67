plugins {
    id 'java'
}

group = 'com.angelsmp'
version = '2.0.0'
description = 'AngelSMP - Angel/Demon elemental SMP plugin.'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'spigot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
}

// Compiled against the LOWEST supported API (Paper 1.21.1) so the bytecode keeps
// working on every newer 1.21+ server. Version-sensitive symbols are resolved at
// runtime (see util/Compat.java). The JDBC drivers are bundled into the fat JAR.
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

// A second classpath used only to VERIFY the sources compile against Spigot too.
configurations {
    spigotApi
}

dependencies {
    spigotApi 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'
    spigotApi 'org.jetbrains:annotations:24.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

// Fat JAR: bundles the plugin classes plus the SQLite/MySQL JDBC drivers so the
// plugin is self-contained (no external library install required).
jar {
    archiveBaseName = 'AngelSMP'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
                'Implementation-Title': 'AngelSMP',
                'Implementation-Version': project.version
        )
    }
}

// Verifies the sources compile against the Spigot API (no Paper-only symbols).
tasks.register('spigotCheck', JavaCompile) {
    description = 'Compiles the plugin sources against the Spigot API to prove Spigot/Purpur compatibility.'
    group = 'verification'
    source = sourceSets.main.java
    classpath = configurations.spigotApi
    destinationDirectory = layout.buildDirectory.dir('spigot-check')
    options.encoding = 'UTF-8'
    options.release = 21
}

build.dependsOn jar
