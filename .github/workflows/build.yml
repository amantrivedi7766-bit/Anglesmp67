name: Build AngelSMP

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Verify Spigot API compatibility
        run: gradle spigotCheck --no-daemon --stacktrace

      - name: Upload AngelSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: AngelSMP-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar \
            --title "AngelSMP ${GITHUB_REF_NAME}" \
            --notes "Automated build of AngelSMP ${GITHUB_REF_NAME}. Paper, Spigot and Purpur compatible (1.21+)."
